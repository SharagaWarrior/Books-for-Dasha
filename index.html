<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр документов PDF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f9;
        }
        header {
            background-color: #1e293b;
            color: #fff;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .btn.active {
            background-color: #1d4ed8;
            font-weight: bold;
            outline: 2px solid #93c5fd;
        }
        main {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <button class="btn active" onclick="showPDF('doc1.pdf', this)">Документ 1</button>
        <button class="btn" onclick="showPDF('doc2.pdf', this)">Документ 2</button>
    </header>

    <main>
        <iframe id="pdfViewer" src="doc1.pdf"></iframe>
    </main>

    <script>
        function showPDF(filePath, buttonElement) {
            // Менять источник файла для iframe
            document.getElementById('pdfViewer').src = filePath;

            // Обновлять активную кнопку
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
